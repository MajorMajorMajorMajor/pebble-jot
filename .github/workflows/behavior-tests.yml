name: Jot behavior tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Keep notes (transactional persistence and recovery)
        run: |
          cc -std=c11 -Wall -Wextra -Werror -I tests/fake -I src/c \
            tests/behavior/notes.c src/c/jot/store.c -o /tmp/jot-notes
          /tmp/jot-notes
      - name: Read notes (navigation, safe delete, touch and drag)
        run: |
          cc -std=c11 -Wall -Wextra -Werror -I src/c \
            tests/behavior/reading.c src/c/jot/reader_review.c \
            src/c/jot/reader_touch.c -o /tmp/jot-reading
          /tmp/jot-reading
      - name: Write notes (caret wrapping and held editing)
        run: |
          cc -std=c11 -Wall -Wextra -Werror -I src/c \
            tests/behavior/writing.c src/c/ui/caret_layout.c \
            src/c/ui/key_repeat.c src/c/keyboard/shift.c -o /tmp/jot-writing
          /tmp/jot-writing
          node tests/behavior/shift-routing.js
      - name: Text-label geometry (shared layout, no pixel freeze)
        run: |
          cc -std=c11 -Wall -Wextra -Werror -I src/c \
            tests/behavior/label_geometry.c src/c/ui/legend_geometry.c \
            -o /tmp/jot-label-geometry
          /tmp/jot-label-geometry
      - name: Back up notes (atomicity, retransmission and export)
        run: node tests/behavior/backup.js

  sdk-build:
    name: Build Emery app with Pebble SDK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      # Use the repository's pinned Pebble SDK environment, rather than a
      # second toolchain installation that can drift from local builds.
      - uses: cachix/install-nix-action@v31
      - uses: cachix/cachix-action@v17
        with:
          name: pebble
          skipPush: true
      - name: Compile, link and package Emery app
        run: nix develop --command pebble build
      - name: Verify packaged PBW exists
        run: |
          pbw="$(find build -type f -name '*.pbw' -print -quit)"
          test -n "$pbw"
          test -s "$pbw"
          unzip -t "$pbw"
