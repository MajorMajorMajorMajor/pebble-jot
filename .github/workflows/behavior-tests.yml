name: Jot behavior tests

on:
  push:
    branches: [main, "feature/issue-39-bundled-backup-viewer", "feature/issue-70-phone-notebook"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Keep notes (transactional persistence and recovery)
        run: |
          cc -std=c11 -Wall -Wextra -Werror -I tests/fake -I src/c \
            tests/behavior/notes.c src/c/jot/store.c \
            src/c/keyboard/compose.c -o /tmp/jot-notes
          /tmp/jot-notes
      - name: Compose Unicode pairs and cycles
        run: |
          cc -std=c11 -Wall -Wextra -Werror -I src/c \
            tests/behavior/compose.c src/c/keyboard/compose.c -o /tmp/jot-compose
          /tmp/jot-compose
          node tests/behavior/compose-routing.js
      - name: Tab rendering and cursor mapping
        run: |
          cc -std=c11 -Wall -Wextra -Werror -I src/c \
            tests/behavior/tabs.c src/c/ui/tab_display.c \
            src/c/ui/caret_layout.c -o /tmp/jot-tabs
          /tmp/jot-tabs
          node tests/behavior/tab-routing.js
      - name: Editor notebook paper polish
        run: node tests/behavior/editor-polish.js
      - name: List Back navigation uses actual scroll offset
        run: |
          cc -std=c11 -Wall -Wextra -Werror -I src/c \
            tests/behavior/list_back.c src/c/jot/list_focus.c \
            src/c/jot/list_touch.c -o /tmp/jot-list-back
          /tmp/jot-list-back
          node tests/behavior/list-back-routing.js
      - name: Reader Back returns scrolled pages home without changing chrome
        run: node tests/behavior/reader-back-routing.js
      - name: Held Reader button scroll repeat and cancellation
        run: |
          cc -std=c11 -Wall -Wextra -Werror -I src/c \
            tests/behavior/reader_repeat.c src/c/jot/reader_repeat.c \
            -o /tmp/jot-reader-repeat
          /tmp/jot-reader-repeat
          node tests/behavior/reader-repeat-routing.js
      - name: Read notes (navigation, safe delete, touch and drag)
        run: |
          cc -std=c11 -Wall -Wextra -Werror -I src/c \
            tests/behavior/reading.c src/c/jot/reader_review.c \
            src/c/jot/reader_touch.c -o /tmp/jot-reading
          /tmp/jot-reading
          node tests/behavior/touch-target-routing.js
      - name: Write notes (caret wrapping and held editing)
        run: |
          cc -std=c11 -Wall -Wextra -Werror -I src/c \
            tests/behavior/writing.c src/c/ui/caret_layout.c \
            src/c/ui/key_repeat.c src/c/keyboard/shift.c -o /tmp/jot-writing
          /tmp/jot-writing
          node tests/behavior/shift-routing.js
      - name: Text-label geometry (shared layout, no pixel freeze)
        run: |
          cc -std=c11 -Wall -Wextra -Werror -I src/c \
            tests/behavior/label_geometry.c src/c/ui/legend_geometry.c \
            -o /tmp/jot-label-geometry
          /tmp/jot-label-geometry
      - name: Check watch message keys against Pebble package metadata
        run: node tests/behavior/message-keys.js
      - name: Detect stale incremental Pebble-generated message keys
        run: python3 scripts/check-generated-message-keys.py --self-test
      - name: Embedded Settings fallback matches bundled page
        run: python3 scripts/sync-settings-fallback.py --check
      - name: Phone-to-watch upload with durable receipts and retry
        run: node tests/behavior/watch-transfer.js
      - name: Independent phone notebook (atomic watch imports and phone edits)
        run: node tests/behavior/backup.js
      - name: Bundled phone notebook viewer and editor
        run: |
          node tests/behavior/bundled-backup.js
          python3 scripts/pack-bundled-config.py --self-test

  sdk-build:
    name: Build Emery app with Pebble SDK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      # Use the repository's pinned Pebble SDK environment, rather than a
      # second toolchain installation that can drift from local builds.
      - uses: cachix/install-nix-action@v31
      - uses: cachix/cachix-action@v17
        with:
          name: pebble
          skipPush: true
      - name: Compile, link and package Emery app
        run: |
          nix develop --command sh scripts/build-jot.sh --build-only
      - name: Verify packaged PBW exists
        run: |
          pbw="$(find build -type f -name '*.pbw' -print -quit)"
          test -n "$pbw"
          test -s "$pbw"
          unzip -t "$pbw"
          unzip -p "$pbw" appinfo.json | python3 -c 'import json,sys; v=json.load(sys.stdin); assert v["manifestVersion"]==2 and v["configPage"]=="config.html"'
          unzip -p "$pbw" config.html | grep -q "Jot"
