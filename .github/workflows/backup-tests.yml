name: Jot regression tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate all Pebble PNG bitmap resources
        run: python3 tests/verify-png-assets.py
      - name: Test phone backup protocol
        run: node tests/backup-js.test.js
      - name: Check canonical gesture mapping
        run: node tests/gesture-map.test.js
      - name: Verify editor caret overlay invariants
        run: node tests/editor-caret.test.js
      - name: Guard Emery RAM budget and long-note buffers
        run: node tests/ram-budget.test.js
      - name: Verify Pocket Notebook editor styling
        run: node tests/notebook-style.test.js
      - name: Verify screen navigation wiring
        run: node tests/navigation-flow.test.js
      - name: Verify touch SAVE routing and safe reader transitions
        run: node tests/touch-save.test.js
      - name: Test persistent reader review action-bar state machine
        run: |
          cc -std=c11 -Wall -Wextra -Werror -I src/c \
            tests/reader-review-test.c src/c/jot/reader_review.c -o /tmp/jot-reader-review-test
          /tmp/jot-reader-review-test
      - name: Test contextual reader Back touch controls
        run: |
          cc -std=c11 -Wall -Wextra -Werror -I src/c \
            tests/reader-touch-test.c src/c/jot/reader_touch.c -o /tmp/jot-reader-touch-test
          /tmp/jot-reader-touch-test
      - name: Test selectable NEW item in notes list
        run: |
          cc -std=c11 -Wall -Wextra -Werror -I src/c \
            tests/list-focus-test.c src/c/jot/list_focus.c -o /tmp/jot-list-focus-test
          /tmp/jot-list-focus-test
      - name: Test touch-scrolling list and card hitboxes
        run: |
          cc -std=c11 -Wall -Wextra -Werror -I src/c \
            tests/list-touch-test.c src/c/jot/list_touch.c -o /tmp/jot-list-touch-test
          /tmp/jot-list-touch-test
      - name: Compile and test persistent note storage
        run: |
          cc -std=c11 -Wall -Wextra -Werror -I tests/fake -I src/c \
            tests/store-test.c src/c/jot/store.c -o /tmp/jot-store-test
          /tmp/jot-store-test
      - name: Test wrap-aware caret geometry
        run: |
          cc -std=c11 -Wall -Wextra -Werror -I src/c \
            tests/caret-layout-test.c src/c/ui/caret_layout.c -o /tmp/jot-caret-layout-test
          /tmp/jot-caret-layout-test
